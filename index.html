<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PERSONAL TRAINER</title>
    <!-- FontAwesome 아이콘 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 기본 리셋 및 폰트 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #0f0f0f;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 네비게이션 바 & 햄버거 메뉴 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .header-title {
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 600;
            color: #d1d1d1;
        }

        .menu-btn {
            font-size: 22px;
            cursor: pointer;
            color: #ffffff;
            background: none;
            border: none;
        }

        /* 메인 랜딩 섹션 */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.85)), url('main_bg.jpg') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 100px 25px 30px 25px;
            box-sizing: border-box;
        }

        .hero-content {
            margin-top: auto;
            margin-bottom: auto;
        }

        .hero-title {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .divider {
            width: 40px;
            height: 2px;
            background-color: #777777;
            margin-bottom: 20px;
        }

        .hero-sub {
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .hero-sub strong {
            color: #ffffff;
            font-weight: 700;
        }

        /* 상담 신청하기 버튼 (노란색 배경 / 검은색 글자) */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #FEE500;
            color: #000000;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(254, 229, 0, 0.3);
        }

        .cta-btn i {
            margin-left: 10px;
            font-size: 13px;
            color: #000000;
        }

        .cta-btn:active {
            transform: scale(0.98);
            background-color: #e6ce00;
        }

        /* 하단 4가지 특징 아이콘 바 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .feature-item i {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .feature-item span {
            font-size: 10.5px;
            color: #cccccc;
            letter-spacing: -0.5px;
            word-break: keep-all;
        }

        /* 카테고리 전체화면 오버레이 메뉴 */
        .menu-overlay {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background-color: rgba(15, 15, 15, 0.98);
            z-index: 2000;
            transition: right 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .menu-overlay.active {
            right: 0;
        }

        .close-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 28px;
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
        }

        .menu-list {
            list-style: none;
            text-align: center;
            width: 100%;
        }

        .menu-list li {
            margin: 18px 0;
        }

        .menu-list a {
            color: #ffffff;
            text-decoration: none;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .menu-list a:hover {
            color: #aaaaaa;
        }

        /* 카테고리 콘텐츠 섹션 공통 스타일 */
        .content-section {
            padding: 80px 20px;
            min-height: 100vh;
            border-bottom: 1px solid #222222;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            border-left: 4px solid #ffffff;
            padding-left: 12px;
        }

        .more-btn {
            font-size: 13px;
            color: #FEE500;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 비포애프터 단일 이미지 카드 스타일 */
        .ba-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .ba-card {
            width: 100%;
            background-color: #161616;
            border: 1px solid #262626;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .ba-single-photo {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            background-color: #222;
            margin-bottom: 12px;
        }

        .ba-single-photo img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .ba-info {
            text-align: center;
            padding: 4px 0 2px 0;
        }

        .ba-info-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .ba-info-desc {
            font-size: 12.5px;
            color: #aaaaaa;
        }

        /* 후기 스크롤바 숨김용 스타일 */
        .review-scroll-container::-webkit-scrollbar {
            display: none;
        }
        .review-scroll-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 15px;
            scrollbar-width: none;
        }
        .review-card {
            flex: 0 0 82%;
            max-width: 320px;
            scroll-snap-align: center;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background-color: #1
